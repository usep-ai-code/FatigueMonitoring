<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Orange Diamond (top left) -->
  <path d="M 280 30 L 320 70 L 280 110 L 240 70 Z" fill="url(#orangeGradient)" />
  
  <!-- Blue Diamond (top right) -->
  <path d="M 340 30 L 380 70 L 340 110 L 300 70 Z" fill="url(#blueGradient)" />
  
  <!-- Teal Diamond (bottom left) -->
  <path d="M 280 110 L 320 150 L 280 190 L 240 150 Z" fill="url(#tealGradient)" />
  
  <!-- Green Diamond (bottom right) -->
  <path d="M 340 110 L 380 150 L 340 190 L 300 150 Z" fill="url(#greenGradient)" />
  
  <!-- AlamTri Text -->
  <text x="80" y="120" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white" letter-spacing="2">
    AlamTri
  </text>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E5C8A;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="tealGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2A8B8B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1B5A5A;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7EC850;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5A9F35;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
